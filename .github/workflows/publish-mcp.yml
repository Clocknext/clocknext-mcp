# Automated release: push a version tag (vX.Y.Z) and this publishes the npm
# package AND registers the new version in the official MCP Registry.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   - NPM_TOKEN — an npm automation token for the @clocknext org.
#     (Prefer npm "trusted publishing" via OIDC to drop this token entirely —
#      configure it on npmjs.com for @clocknext/mcp, then delete the token line.)
# The MCP Registry needs NO secret: it authenticates with GitHub OIDC, and the
# repo lives under the ClockNext org, so it can publish io.github.ClockNext/*.
#
# Release flow:
#   1. bump the version in package.json, server.json (both "version" fields),
#      src/index.ts and .claude-plugin/plugin.json; rebuild; commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z   → this workflow does the rest.

name: Publish (npm + MCP Registry)

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — MCP Registry auth + npm provenance
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG — bump all version files before tagging."
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Keep server.json's versions in lockstep with the tag (belt-and-braces).
      - name: Sync server.json version to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
