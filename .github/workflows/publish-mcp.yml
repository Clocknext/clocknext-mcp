# Automated release: push a version tag (vX.Y.Z) and this publishes the npm
# package AND registers the new version in the official MCP Registry.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   - NPM_TOKEN — an npm automation token for the @clocknext org.
#     (Prefer npm "trusted publishing" via OIDC to drop this token entirely —
#      configure it on npmjs.com for @clocknext/mcp, then delete the token line.)
# The MCP Registry needs NO secret: it authenticates with GitHub OIDC, and the
# repo lives under the ClockNext org, so it can publish io.github.ClockNext/*.
#
# Release flow:
#   1. bump the version in package.json, server.json (both "version" fields),
#      src/index.ts and .claude-plugin/plugin.json; rebuild; commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z   → this workflow does the rest.
#
# The workflow is re-runnable. `npm publish` is skipped when the version is
# already on npm, and the registry step waits for npm to actually serve the new
# version first (npm publishes asynchronously — "may take a few minutes to
# become available" — and the registry validates against npm's public API, so
# registering straight after publishing 404s). If a run still fails late, use
# Actions → Publish → Run workflow rather than bumping the version to retry.

name: Publish (npm + MCP Registry)

on:
  push:
    tags: ["v*"]
  # Manual re-run, for when a later step fails after npm already published.
  # Without this the only way to retry was to bump the version and re-tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish/register (e.g. 0.10.0). Defaults to package.json."
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — MCP Registry auth + npm provenance
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve and verify the version
        id: ver
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::tag v$TAG does not match package.json version $PKG — bump all version files before tagging."
              exit 1
            fi
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "Releasing $PKG"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Keep server.json's versions in lockstep with the tag (belt-and-braces).
      - name: Sync server.json version to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      # Skipped when the version is already on npm, so a re-run after a failure
      # in a LATER step doesn't die here on "cannot publish over an existing
      # version" — which is exactly what blocked recovering the 0.9.0 release.
      - name: Publish to npm (with provenance)
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@clocknext/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@clocknext/mcp@$VERSION is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm answers "your package is being processed and may take a few minutes
      # to become available", and the MCP Registry validates the version by
      # querying npm — so registering immediately after publishing 404s. That
      # is what failed the 0.9.0 release. Wait for npm to actually serve it.
      - name: Wait for npm to serve the new version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for i in $(seq 1 60); do
            if curl -fsS "https://registry.npmjs.org/@clocknext/mcp" \
                 | jq -e --arg v "$VERSION" '.versions | has($v)' >/dev/null; then
              echo "npm is serving $VERSION (after $((i*10))s)"
              exit 0
            fi
            echo "not yet visible on npm; retrying in 10s ($i/60)"
            sleep 10
          done
          echo "::error::npm did not serve $VERSION within 10 minutes. The npm publish succeeded — re-run this workflow (Actions → Publish → Run workflow) to register it."
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
